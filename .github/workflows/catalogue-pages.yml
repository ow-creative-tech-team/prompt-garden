name: Publish AI tools catalogue

on:
  push:
    branches:
      - main
      - feature/ai-tools-catalogue
    paths:
      - "catalogue/**"
      - ".github/workflows/catalogue-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload catalogue
        uses: actions/upload-pages-artifact@v3
        with:
          path: catalogue

      - name: Publish catalogue
        id: deployment
        uses: actions/deploy-pages@v4
