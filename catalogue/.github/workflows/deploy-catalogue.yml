name: Deploy catalogue preview

on:
  push:
    branches:
      - feature/ai-tools-catalogue
    paths:
      - "catalogue/**"
      - ".github/workflows/deploy-catalogue.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./catalogue
      - id: deployment
        uses: actions/deploy-pages@v4
